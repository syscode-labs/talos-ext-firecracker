name: Publish

on:
  push:
    tags:
      - "v*"
      - "talos-ext-firecracker-v*"

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/syscode-labs/talos-ext-firecracker

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write

    steps:
      - # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up QEMU
        # v4.0.0
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a

      - name: Set up Docker Buildx
        # v4.0.0
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Log in to GHCR
        # v4.0.0
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Cosign signing secret
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          test -n "${COSIGN_PRIVATE_KEY}" || {
            echo "COSIGN_PRIVATE_KEY repository secret is required" >&2
            exit 1
          }
          test -n "${COSIGN_PASSWORD}" || {
            echo "COSIGN_PASSWORD repository secret is required" >&2
            exit 1
          }

      - name: Build and push extension image
        id: build
        # v7.0.0
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest

      - name: Install Cosign
        # v4.1.2
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign extension image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign \
            --yes \
            --recursive \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE}@${IMAGE_DIGEST}"

      - name: Publish GitHub release (undraft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --draft=false
        continue-on-error: true

      - name: Dispatch talos-images rebuild
        env:
          GH_TOKEN: ${{ secrets.TALOS_IMAGES_DISPATCH_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/syscode-labs/talos-images/dispatches \
            -f event_type="firecracker-release" \
            -f "client_payload[firecracker_version]=${{ github.ref_name }}"
        continue-on-error: true
